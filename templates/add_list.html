<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Add Product - Mumbai Opticals</title>
  <!-- Bootstrap 5 & Font Awesome -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <style>
    body {
      background-color: #f8f9fc;
      font-family: 'Segoe UI', Roboto, system-ui, sans-serif;
    }

    /* Main Content */
    .main-content {
      margin-left: 280px;
      padding: 2rem;
    }

    .header {
      background: white;
      padding: 1rem 2rem;
      border-radius: 15px;
      box-shadow: 0 5px 20px rgba(0,0,0,0.05);
      margin-bottom: 2rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .page-title {
      color: #0b2f4e;
      font-weight: 600;
      margin: 0;
    }

    .form-card {
      background: white;
      border-radius: 25px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.1);
      padding: 2.5rem;
    }

    .form-label {
      color: #0b2f4e;
      font-weight: 600;
      font-size: 0.95rem;
      margin-bottom: 0.5rem;
    }

    .form-control, .form-select {
      border-radius: 12px;
      padding: 0.75rem 1rem;
      border: 1.5px solid #e1e9f0;
      transition: all 0.2s;
    }

    .form-control:focus, .form-select:focus {
      border-color: #0b2f4e;
      box-shadow: 0 0 0 0.2rem rgba(11,47,78,0.1);
    }

    .dynamic-fields {
      background: #f8f9fc;
      border-radius: 15px;
      padding: 1.5rem;
      margin-top: 1.5rem;
      border: 1px dashed #cbdae6;
    }

    .submit-btn {
      background: #0b2f4e;
      color: white;
      border: none;
      padding: 1rem;
      border-radius: 12px;
      font-weight: 600;
      font-size: 1.1rem;
      width: 100%;
      margin-top: 2rem;
      transition: 0.2s;
    }

    .submit-btn:hover {
      background: #1e4a6f;
      transform: translateY(-2px);
      box-shadow: 0 5px 15px rgba(11,47,78,0.3);
    }

    /* List Management Styles */
    .list-section {
      margin-top: 2rem;
      border-top: 2px solid #e1e9f0;
      padding-top: 2rem;
    }

    .section-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1.5rem;
    }

    .section-header h3 {
      color: #0b2f4e;
      font-size: 1.3rem;
      font-weight: 600;
      margin: 0;
    }

    .add-list-item {
      background: #0b2f4e;
      color: white;
      border: none;
      width: 40px;
      height: 40px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.2rem;
      cursor: pointer;
      transition: 0.2s;
    }

    .add-list-item:hover {
      background: #1e4a6f;
      transform: scale(1.1);
    }

    .list-item-row {
      background: #f8f9fc;
      border-radius: 10px;
      padding: 1rem;
      margin-bottom: 0.8rem;
      display: flex;
      align-items: center;
      gap: 1rem;
      border: 1px solid #e1e9f0;
    }

    .list-item-row .item-input {
      flex: 1;
    }

    .list-item-row .remove-btn {
      background: #dc3545;
      color: white;
      border: none;
      width: 35px;
      height: 35px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: 0.2s;
    }

    .list-item-row .remove-btn:hover {
      background: #c82333;
    }

    .list-item-row .drag-handle {
      color: #6c757d;
      cursor: move;
      font-size: 1.2rem;
    }

    @media (max-width: 768px) {
      .sidebar {
        width: 0;
        display: none;
      }
      .main-content {
        margin-left: 0;
      }
    }
  </style>
</head>
<body>
    <!-- Include Navbar -->
    {% include 'navbar.html' %}

  <!-- Main Content -->
  <div class="main-content">
    <div class="header">
      <h2 class="page-title"><i class="fas fa-plus-circle me-2"></i>Add New Product</h2>
      <div>
        <span class="badge bg-light text-dark p-2">Admin</span>
      </div>
    </div>

    <div class="form-card">
      <!-- Main Category Dropdown -->
      <div class="mb-4">
        <label class="form-label">Select Main Category</label>
        <select class="form-select" id="mainCategory" onchange="updateSubCategory()">
          <option value="">Choose category...</option>
          <option value="specs">Specs</option>
          <option value="watches">Watches</option>
        </select>
      </div>

      <!-- Dynamic Fields Container -->
      <div id="dynamicFields" style="display: none;"></div>

      <!-- Basic Fields (always shown) -->
      <div class="row mt-4">
        <div class="col-md-6 mb-3">
          <label class="form-label">Product Name</label>
          <input type="text" class="form-control" id="productName" placeholder="Enter product name">
        </div>
        <div class="col-md-6 mb-3">
          <label class="form-label">Brand</label>
          <select class="form-select" id="brand">
            <option value="">Select brand...</option>
            <option value="oakley">Oakley</option>
            <option value="rayban">Ray-Ban</option>
            <option value="titan">Titan</option>
            <option value="fossil">Fossil</option>
            <option value="casio">Casio</option>
          </select>
        </div>
        <div class="col-md-6 mb-3">
          <label class="form-label">Price (₹)</label>
          <input type="number" class="form-control" id="price" placeholder="Enter price">
        </div>
        <div class="col-md-6 mb-3">
          <label class="form-label">Initial Stock</label>
          <input type="number" class="form-control" id="stock" placeholder="Enter stock quantity">
        </div>
        <div class="col-12 mb-3">
          <label class="form-label">Description</label>
          <textarea class="form-control" id="description" rows="3" placeholder="Enter product description"></textarea>
        </div>
      </div>

      <button class="submit-btn" onclick="submitProduct()">
        <i class="fas fa-save me-2"></i>Save Product
      </button>
    </div>
  </div>

  <script>
    function toggleSubmenu(id) {
      const submenu = document.getElementById(id);
      submenu.classList.toggle('show');
    }

    function updateSubCategory() {
      const mainCat = document.getElementById('mainCategory').value;
      const dynamicDiv = document.getElementById('dynamicFields');

      if (mainCat === 'specs') {
        dynamicDiv.style.display = 'block';
        dynamicDiv.innerHTML = `
          <label class="form-label">Sub Category (Specs)</label>
          <select class="form-select mb-3" id="subCategory">
            <option value="">Select type...</option>
            <option value="goggles">Goggles</option>
            <option value="frames">Frames</option>
            <option value="lens">Lens</option>
          </select>

          <div class="dynamic-fields">
            <div class="row">
              <div class="col-md-6 mb-3">
                <label class="form-label">Frame Material</label>
                <select class="form-select" id="frameMaterial">
                  <option value="">Select...</option>
                  <option value="plastic">Plastic</option>
                  <option value="metal">Metal</option>
                  <option value="acetate">Acetate</option>
                  <option value="titanium">Titanium</option>
                </select>
              </div>
              <div class="col-md-6 mb-3">
                <label class="form-label">Lens Type</label>
                <select class="form-select" id="lensType">
                  <option value="">Select...</option>
                  <option value="polarized">Polarized</option>
                  <option value="bluecut">Blue Cut</option>
                  <option value="photochromic">Photochromic</option>
                  <option value="regular">Regular</option>
                </select>
              </div>
              <div class="col-md-6 mb-3">
                <label class="form-label">Frame Color</label>
                <input type="text" class="form-control" id="frameColor" placeholder="e.g., Matte Black">
              </div>
              <div class="col-md-6 mb-3">
                <label class="form-label">Size</label>
                <select class="form-select" id="size">
                  <option value="">Select...</option>
                  <option value="small">Small</option>
                  <option value="medium">Medium</option>
                  <option value="large">Large</option>
                </select>
              </div>
            </div>
          </div>
        `;
      } else if (mainCat === 'watches') {
        dynamicDiv.style.display = 'block';
        dynamicDiv.innerHTML = `
          <label class="form-label">Sub Category (Watches)</label>
          <select class="form-select mb-3" id="subCategory">
            <option value="">Select type...</option>
            <option value="wrist">Wrist Watch</option>
            <option value="hand">Hand Watch</option>
          </select>

          <div class="dynamic-fields">
            <div class="row">
              <div class="col-md-6 mb-3">
                <label class="form-label">Watch Type</label>
                <select class="form-select" id="watchType">
                  <option value="">Select...</option>
                  <option value="analog">Analog</option>
                  <option value="digital">Digital</option>
                  <option value="chronograph">Chronograph</option>
                  <option value="smart">Smart Watch</option>
                </select>
              </div>
              <div class="col-md-6 mb-3">
                <label class="form-label">Strap Material</label>
                <select class="form-select" id="strapMaterial">
                  <option value="">Select...</option>
                  <option value="leather">Leather</option>
                  <option value="metal">Metal</option>
                  <option value="silicone">Silicone</option>
                  <option value="nylon">Nylon</option>
                </select>
              </div>
              <div class="col-md-6 mb-3">
                <label class="form-label">Dial Color</label>
                <input type="text" class="form-control" id="dialColor" placeholder="e.g., Black">
              </div>
              <div class="col-md-6 mb-3">
                <label class="form-label">Water Resistance</label>
                <select class="form-select" id="waterResistance">
                  <option value="">Select...</option>
                  <option value="30m">30m</option>
                  <option value="50m">50m</option>
                  <option value="100m">100m</option>
                  <option value="200m">200m</option>
                </select>
              </div>
            </div>
          </div>
        `;
      } else {
        dynamicDiv.style.display = 'none';
      }
    }

    function submitProduct() {
      const mainCat = document.getElementById('mainCategory').value;
      const productName = document.getElementById('productName').value;
      const price = document.getElementById('price').value;
      const stock = document.getElementById('stock').value;

      if (!mainCat || !productName || !price || !stock) {
        alert('Please fill all required fields');
        return;
      }

      alert('Product added successfully!');
      window.location.href = 'goggles-list.html';
    }
  </script>
</body>
</html>
