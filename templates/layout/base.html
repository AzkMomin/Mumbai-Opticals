<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="csrf-token" content="{{ csrf_token() }}">
    <title>{% block title %}Mumbai Opticals{% endblock %}</title>
    <link rel="icon" href="{{ url_for('static', filename='Images/Logo/Logo.png') }}">
    <link href="{{ cdn.bootstrap_css }}" rel="stylesheet">
    <link rel="stylesheet" href="{{ cdn.fontawesome_css }}">
    <link rel="stylesheet" href="{{ asset('css/app.css') }}">
    {% block head %}{% endblock %}
    {% block layout_css %}<link rel="stylesheet" href="{{ asset('css/layout.css') }}">{% endblock %}
</head>
<body{% block body_attrs %}{% endblock %}>
    {% block nav %}{% include 'layout/navbar.html' %}{% endblock %}
    {% block flashes %}{% include 'layout/flash.html' %}{% endblock %}
    {% block content %}{% endblock %}
    <script src="{{ cdn.bootstrap_js }}"></script>
    <script src="{{ asset('js/app.js') }}"></script>
    {% block scripts %}{% endblock %}
</body>
</html>
